<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Gomara - Control Remoto Cloud</title>
    <!-- Cliente MQTT nativo para el navegador vía WebSockets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/4.3.7/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #090d16 0%, #111126 100%);
            color: #f1f5f9;
            text-align: center;
            padding: 20px 15px;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box {
            width: 100%;
            max-width: 440px;
            background: rgba(22, 28, 45, 0.85);
            padding: 30px 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            border: 1px solid rgba(56,189,248,0.2);
            backdrop-filter: blur(16px);
        }
        h2 {
            color: #38bdf8;
            margin: 0 0 5px 0;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .subtitle {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 24px;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        input[type=text], input[type=password] {
            width: 100%;
            padding: 12px 14px;
            background: #0b0f19;
            border: 1px solid #1e293b;
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #38bdf8;
            outline: none;
            background: #0f172a;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #090d16;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s ease;
        }
        .btn:hover { background: #0ea5e9; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-red { background: #ef4444; color: #fff; }
        .btn-red:hover { background: #dc2626; }
        .hidden { display: none; }
        .grid-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .status {
            font-size: 12px;
            color: #34d399;
            margin-top: 20px;
            font-weight: 600;
            padding: 8px;
            background: rgba(52, 211, 153, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- PANTALLA DE ACCESO/SEGURIDAD -->
    <div class="box" id="loginScreen">
        <h2>Seguridad</h2>
        <div class="subtitle">Ingrese la clave de control para continuar</div>
        <div class="form-group">
            <label>Contraseña de acceso</label>
            <input type="password" id="passInput" placeholder="••••••••" onkeydown="if(event.key==='Enter') verificarPassword()">
        </div>
        <button class="btn" onclick="verificarPassword()">Ingresar al Panel</button>
    </div>

    <!-- PANEL DE CONTROL DE COMANDOS -->
    <div class="box hidden" id="controlScreen">
        <h2>Radio Gomara</h2>
        <div class="subtitle">Consola de Mando Cloud (MQTT)</div>
        
        <div class="form-group">
            <label>Texto Personalizado A</label>
            <input type="text" id="msgA" maxlength="50" value="COMUNICACION GOMARA">
            <button class="btn" onclick="enviarMensaje('A', document.getElementById('msgA').value)">Lanzar Texto A</button>
        </div>

        <div class="form-group" style="margin-top:20px;">
            <label>Texto Personalizado B</label>
            <input type="text" id="msgB" maxlength="50" value="ESTUDIO EN VIVO">
            <button class="btn" onclick="enviarMensaje('B', document.getElementById('msgB').value)">Lanzar Texto B</button>
        </div>

        <div class="grid-buttons">
            <button class="btn" onclick="enviarComando('2')">EN VIVO</button>
            <button class="btn" onclick="enviarComando('3')">PUBLICIDAD</button>
            <button class="btn" onclick="enviarComando('4')">INICIO</button>
            <button class="btn" onclick="enviarComando('5')">FIN</button>
            <button class="btn" onclick="enviarComando('6')">ESTUDIO A</button>
            <button class="btn" onclick="enviarComando('7')">ESTUDIO B</button>
        </div>

        <div class="grid-buttons">
            <button class="btn" onclick="enviarComando('W')">Luz Blanca ON</button>
            <button class="btn btn-red" onclick="enviarComando('w')">Luz Blanca OFF</button>
            <button class="btn" onclick="enviarComando('R')">Luz Roja ON</button>
            <button class="btn btn-red" onclick="enviarComando('r')">Luz Roja OFF</button>
        </div>

        <div class="status" id="connectionStatus">Conectando con el servidor Cloud...</div>
    </div>

    <script>
        // CONFIGURACIÓN CLOUD
        // Reemplaza TU_CLUSTER por tu dirección de HiveMQ Cloud
        const brokerUrl = "wss://f451d2f10b9c484ba36dc859e45ca653.s1.eu.hivemq.cloud:8884/mqtt";
        const mqttUser = "radio_admin";
        const mqttPass = "gomara2026";
        const claveSecreta = "1234";

        let client = null;

        function verificarPassword() {
            let ingresada = document.getElementById('passInput').value;
            if(ingresada === claveSecreta) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('controlScreen').classList.remove('hidden');
                conectarMQTT();
            } else {
                alert("Contraseña incorrecta");
            }
        }

        function conectarMQTT() {
            client = mqtt.connect(brokerUrl, {
                username: mqttUser,
                password: mqttPass,
                clean: true
            });

            client.on('connect', () => {
                document.getElementById('connectionStatus').innerText = "Conectado al Servidor Nube ✓";
            });

            client.on('error', (err) => {
                document.getElementById('connectionStatus').innerText = "Error de conexión con la Nube";
                console.error(err);
            });
        }

        function enviarComando(cmd) {
            if(client && client.connected) {
                client.publish("gomara/control", cmd);
            } else {
                alert("Sin conexión con el servidor");
            }
        }

        function enviarMensaje(tipo, texto) {
            if(client && client.connected) {
                let payload = tipo + ":" + texto;
                client.publish("gomara/control", payload);
            } else {
                alert("Sin conexión con el servidor");
            }
        }
    </script>
</body>
</html>
