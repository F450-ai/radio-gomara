<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Radio Gomara</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 5px;
      color: #00E676;
    }

    .status-bar {
      font-size: 14px;
      margin-bottom: 20px;
      padding: 6px 12px;
      border-radius: 20px;
      background-color: #333;
    }

    .connected { color: #00E676; }
    .disconnected { color: #FF5252; }

    #loginScreen {
      margin-top: 50px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      background-color: #1E1E1E;
      padding: 20px;
      border-radius: 12px;
    }

    .login-box {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
    }

    .error-msg {
      color: #FF5252;
      font-size: 13px;
      display: none;
    }

    #mainContent {
      display: none;
      width: 100%;
      max-width: 1000px;
    }

    .dashboard-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .dashboard-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-areas: 
          "mensajes botones"
          "luces luces";
        gap: 20px;
      }
      .card-mensajes { grid-area: mensajes; }
      .card-botones  { grid-area: botones; }
      .card-luces    { grid-area: luces; }
    }

    .section-card {
      background-color: #1E1E1E;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #B0BEC5;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .grid-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      background-color: #2C2C2C;
      color: #E0E0E0;
      transition: all 0.2s ease;
      border: 2px solid transparent;
    }

    button:hover { background-color: #3A3A3A; }

    button.active-mode {
      background-color: #00C853 !important;
      color: #000000 !important;
      border-color: #69F0AE;
      box-shadow: 0 0 10px rgba(0, 230, 118, 0.4);
    }

    .light-btn { background-color: #263238; color: #ECEFF1; }

    button.light-on-white {
      background-color: #FFFDE7 !important;
      color: #000000 !important;
      border-color: #FFF176;
      box-shadow: 0 0 12px rgba(255, 255, 225, 0.5);
    }

    button.light-on-red {
      background-color: #D50000 !important;
      color: #FFFFFF !important;
      border-color: #FF5252;
      box-shadow: 0 0 12px rgba(255, 82, 82, 0.5);
    }

    .msg-group {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    input[type="text"], input[type="password"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #121212;
      color: #FFF;
      font-size: 14px;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      outline: none;
      border-color: #00E676;
    }

    .btn-save { background-color: #455A64; color: #FFF; padding: 10px; font-size: 13px; }
    .btn-save:hover { background-color: #546E7A; }

    .btn-send { background-color: #2979FF; color: #FFF; padding: 10px; font-size: 13px; }
    .btn-send:hover { background-color: #2962FF; }

    .btn-quick { background-color: #00897B; color: #FFF; padding: 10px 14px; font-size: 13px; }
    .btn-quick:hover { background-color: #00796B; }
  </style>
</head>
<body>

  <h1>RADIO GOMARA</h1>

  <!-- LOGIN -->
  <div id="loginScreen">
    <div class="section-title">Acceso Restringido</div>
    <p style="font-size: 14px; color: #aaa;">Ingresa la contraseña para acceder:</p>
    <div class="login-box">
      <input type="password" id="passInput" placeholder="Contraseña..." onkeydown="detectarEnterLogin(event)">
      <button class="btn-send" onclick="validarAcceso()" style="padding: 10px;">Ingresar</button>
      <div id="errorMsg" class="error-msg">Contraseña incorrecta</div>
    </div>
  </div>

  <!-- PANEL PRINCIPAL -->
  <div id="mainContent">
    <div id="status" class="status-bar disconnected" style="text-align: center;">Estado: Desconectado</div>

    <div class="dashboard-grid">

      <!-- 1. MENSAJES (Izquierda en PC) -->
      <div class="section-card card-mensajes">
        <div class="section-title">Mensajes Personalizados</div>
        
        <!-- A -->
        <div class="msg-group">
          <input type="text" id="inputA" placeholder="Texto A..." oninput="guardarLocalYSilencioso('A', this.value)">
          <button class="btn-save" onclick="guardarMensaje('A', 'inputA')">Guardar</button>
          <button class="btn-send" id="btnMsgA" onclick="enviarAlAire('A', 'inputA', 'btnMsgA')">Al Aire</button>
        </div>

        <!-- B -->
        <div class="msg-group">
          <input type="text" id="inputB" placeholder="Texto B..." oninput="guardarLocalYSilencioso('B', this.value)">
          <button class="btn-save" onclick="guardarMensaje('B', 'inputB')">Guardar</button>
          <button class="btn-send" id="btnMsgB" onclick="enviarAlAire('B', 'inputB', 'btnMsgB')">Al Aire</button>
        </div>

        <!-- C -->
        <div class="msg-group">
          <input type="text" id="inputC" placeholder="Texto C..." oninput="guardarLocalYSilencioso('C', this.value)">
          <button class="btn-save" onclick="guardarMensaje('C', 'inputC')">Guardar</button>
          <button class="btn-send" id="btnMsgC" onclick="enviarAlAire('C', 'inputC', 'btnMsgC')">Al Aire</button>
        </div>

        <div class="section-title" style="margin-top: 20px; font-size: 14px;">Mensajes Rápidos (Presets)</div>

        <!-- D -->
        <div class="msg-group">
          <input type="text" id="inputD" placeholder="Rápido 1..." oninput="guardarLocalYSilencioso('D', this.value)">
          <button class="btn-quick" id="btnMsgD" onclick="enviarAlAire('D', 'inputD', 'btnMsgD')">Al Aire</button>
        </div>

        <!-- E -->
        <div class="msg-group">
          <input type="text" id="inputE" placeholder="Rápido 2..." oninput="guardarLocalYSilencioso('E', this.value)">
          <button class="btn-quick" id="btnMsgE" onclick="enviarAlAire('E', 'inputE', 'btnMsgE')">Al Aire</button>
        </div>

        <!-- F -->
        <div class="msg-group">
          <input type="text" id="inputF" placeholder="Rápido 3..." oninput="guardarLocalYSilencioso('F', this.value)">
          <button class="btn-quick" id="btnMsgF" onclick="enviarAlAire('F', 'inputF', 'btnMsgF')">Al Aire</button>
        </div>
      </div>

      <!-- 2. MODOS DE CARTEL (Derecha en PC) -->
      <div class="section-card card-botones">
        <div class="section-title">Modos de Cartel</div>
        <div class="grid-buttons">
          <button id="btn1" onclick="seleccionarModo('1', 'btn1')">5 SEG</button>
          <button id="btn2" onclick="seleccionarModo('2', 'btn2')">EN VIVO</button>
          <button id="btn3" onclick="seleccionarModo('3', 'btn3')">PUBLICIDAD</button>
          <button id="btn4" onclick="seleccionarModo('4', 'btn4')">INICIO</button>
          <button id="btn5" onclick="seleccionarModo('5', 'btn5')">FIN</button>
          <button id="btn6" onclick="seleccionarModo('6', 'btn6')">ESTUDIO A</button>
          <button id="btn7" onclick="seleccionarModo('7', 'btn7')">ESTUDIO B</button>
        </div>
      </div>

      <!-- 3. LUCES (Abajo) -->
      <div class="section-card card-luces">
        <div class="section-title">Control de Luces</div>
        <div class="grid-buttons">
          <button id="btnLuzBlanca" class="light-btn" onclick="toggleLuz('blanca')">LUZ BLANCA: OFF</button>
          <button id="btnLuzRoja" class="light-btn" onclick="toggleLuz('roja')">LUZ ROJA: OFF</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const CLAVE_CORRECTA = "8235";
    const broker = "f451d2f10b9c484ba36dc859e45ca653.s1.eu.hivemq.cloud";
    const port = 8884;
    const topicControl = "gomara/control";
    const topicEstado = "gomara/estado";

    let client = null;
    let estadoLuzBlanca = false;
    let estadoLuzRoja = false;

    window.onload = function() {
      document.getElementById("inputA").value = localStorage.getItem("msg_A") || "";
      document.getElementById("inputB").value = localStorage.getItem("msg_B") || "";
      document.getElementById("inputC").value = localStorage.getItem("msg_C") || "";
      document.getElementById("inputD").value = localStorage.getItem("msg_D") || "";
      document.getElementById("inputE").value = localStorage.getItem("msg_E") || "";
      document.getElementById("inputF").value = localStorage.getItem("msg_F") || "";
    };

    function validarAcceso() {
      const passIngresada = document.getElementById("passInput").value;
      if (passIngresada === CLAVE_CORRECTA) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("mainContent").style.display = "block";
        iniciarConexionMQTT();
      } else {
        document.getElementById("errorMsg").style.display = "block";
        document.getElementById("passInput").value = "";
      }
    }

    function detectarEnterLogin(event) {
      if (event.key === "Enter") validarAcceso();
    }

    function iniciarConexionMQTT() {
      const clientID = "WebControl_" + Math.random().toString(16).substr(2, 8);
      client = new Paho.MQTT.Client(broker, port, clientID);
      client.onConnectionLost = () => {
        document.getElementById("status").innerHTML = "Conexión perdida. Reintentando...";
        document.getElementById("status").className = "status-bar disconnected";
      };
      client.onMessageArrived = (message) => {
        if (message.destinationName === topicEstado) {
          const payload = message.payloadString;
          if (payload === "W") { estadoLuzBlanca = true; actualizarUIFisicaLuz('blanca', true); }
          else if (payload === "w") { estadoLuzBlanca = false; actualizarUIFisicaLuz('blanca', false); }
          else if (payload === "R") { estadoLuzRoja = true; actualizarUIFisicaLuz('roja', true); }
          else if (payload === "r") { estadoLuzRoja = false; actualizarUIFisicaLuz('roja', false); }
        }
      };
      client.connect({
        useSSL: true, userName: "radio_gomara", password: "gomara2026",
        onSuccess: () => {
          document.getElementById("status").innerHTML = "Estado: Conectado a la Nube";
          document.getElementById("status").className = "status-bar connected";
          client.subscribe(topicEstado);
        }
      });
    }

    function enviarComando(msg) {
      if (client && client.isConnected()) {
        const message = new Paho.MQTT.Message(msg);
        message.destinationName = topicControl;
        client.send(message);
      }
    }

    function guardarLocalYSilencioso(prefijo, texto) {
      localStorage.setItem("msg_" + prefijo, texto);
    }

    function guardarMensaje(prefijo, inputId) {
      const texto = document.getElementById(inputId).value;
      enviarComando("TEXT_" + prefijo + ":" + texto);
    }

    function enviarAlAire(prefijo, inputId, btnId) {
      const texto = document.getElementById(inputId).value;
      document.querySelectorAll('.dashboard-grid button, .btn-send, .btn-quick').forEach(b => b.classList.remove('active-mode'));
      document.getElementById(btnId).classList.add('active-mode');
      enviarComando(prefijo + ":" + texto);
    }

    function seleccionarModo(cmd, btnId) {
      document.querySelectorAll('.dashboard-grid button, .btn-send, .btn-quick').forEach(b => b.classList.remove('active-mode'));
      document.getElementById(btnId).classList.add('active-mode');
      enviarComando(cmd);
    }

    function actualizarUIFisicaLuz(tipo, encendido) {
      const btn = document.getElementById(tipo === 'blanca' ? 'btnLuzBlanca' : 'btnLuzRoja');
      btn.innerHTML = (tipo === 'blanca' ? "LUZ BLANCA: " : "LUZ ROJA: ") + (encendido ? "ON" : "OFF");
      btn.className = "light-btn " + (encendido ? (tipo === 'blanca' ? "light-on-white" : "light-on-red") : "");
    }

    function toggleLuz(tipo) {
      if (tipo === 'blanca') {
        estadoLuzBlanca = !estadoLuzBlanca;
        actualizarUIFisicaLuz('blanca', estadoLuzBlanca);
        enviarComando(estadoLuzBlanca ? "W" : "w");
      } else {
        estadoLuzRoja = !estadoLuzRoja;
        actualizarUIFisicaLuz('roja', estadoLuzRoja);
        enviarComando(estadoLuzRoja ? "R" : "r");
      }
    }
  </script>
</body>
</html>
